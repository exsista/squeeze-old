name: Build ESP32-S3 N16R8

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v4.4.8

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          repository: 'sle118/squeezelite-esp32'
          ref: 'master-v4.3'
          submodules: 'recursive'
          fetch-depth: 0

      - name: Configure Firmware
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          git config --global --add safe.directory '*'

          python -m pip install --upgrade pip
          python -m pip install "protobuf==4.25.6" "grpcio-tools==1.62.3"

          rm -rf build sdkconfig

          # Partition table custom - WAJIB ada partisi nvs yang valid
          cat << 'EOF' > partitions.csv
          # Name,   Type, SubType, Offset,  Size,     Flags
          nvs,      data, nvs,     0x9000,  0x6000,
          otadata,  data, ota,     0xf000,  0x2000,
          phy_init, data, phy,     0x11000, 0x1000,
          factory,  app,  factory, 0x20000, 0x400000,
          storage,  data, 0xff,    0x420000,0x100000,
          EOF

          # Konfigurasi sdkconfig.defaults yang kompatibel untuk ESP32-S3 N16R8
          cat << 'EOF' > sdkconfig.defaults
          CONFIG_IDF_TARGET="esp32s3"
          CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y
          CONFIG_ESPTOOLPY_FLASHMODE_DIO=y
          CONFIG_ESPTOOLPY_FLASHFREQ_80M=y

          # Konfigurasi PSRAM Octal sesuai standar fisik N16R8
          CONFIG_SPIRAM=y
          CONFIG_SPIRAM_MODE_OCT=y
          CONFIG_SPIRAM_TYPE_AUTO=y
          CONFIG_SPIRAM_SPEED_80M=y
          CONFIG_SPIRAM_USE_MALLOC=y
          CONFIG_SPIRAM_MEMTEST=y
          CONFIG_SPIRAM_ALLOW_BSS_SEG_EXTERNAL_MEMORY=y

          CONFIG_FREERTOS_THREAD_LOCAL_STORAGE_POINTERS=2
          CONFIG_COMPILER_CXX_EXCEPTIONS=y

          # Partition table custom
          CONFIG_PARTITION_TABLE_CUSTOM=y
          CONFIG_PARTITION_TABLE_CUSTOM_FILENAME="partitions.csv"
          CONFIG_PARTITION_TABLE_FILENAME="partitions.csv"

          # Nonaktifkan Bluetooth (S3 tidak support BT Classic)
          CONFIG_BT_ENABLED=n
          CONFIG_BTAUDIO=n

          # Audio I2S - pin aman, jauh dari JTAG/PSRAM/strapping
          CONFIG_I2S_NUM=0
          CONFIG_I2S_BCK_IO=4
          CONFIG_I2S_WS_IO=5
          CONFIG_I2S_DO_IO=6
          CONFIG_I2S_BITS_PER_CHANNEL_16=y
          CONFIG_I2S_BITS_PER_CHANNEL=16
          EOF

          idf.py set-target esp32s3

          echo 'include_directories("$ENV{IDF_PATH}/components/esp_eth/include")' >> CMakeLists.txt
          echo 'string(APPEND CMAKE_CXX_FLAGS " -fexceptions")' >> CMakeLists.txt

      - name: Compile Firmware
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py build

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: squeezelite-esp32s3-n16r8
          path: |
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/ota_data_initial.bin
            build/squeezelite*.bin
